packages:
  - 'vane-dux'
  - 'sandbox/fixtures'
  - 'sandbox/demo-minimal'
  - 'sandbox/demo-main'
  - 'sandbox/demo-comparisons'

minimumReleaseAge: 4320
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver
  - undici-types
  # chokidar 4.x dropped provenance attestation; required by @pandacss/node (demo-comparisons)
  - chokidar
blockExoticSubdeps: true
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
